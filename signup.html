<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <div class="signup-box">
      <h2>Sign Up</h2>
      <form id="signupForm">
        <label for="newUsername">Username</label>
        <input type="text" id="newUsername" placeholder="Choose a username" required />

        <label for="newPassword">Password</label>
        <input type="password" id="newPassword" placeholder="Choose a password" required />

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Type your password again" required />

        <button type="submit">Create Account</button>
      </form>

      <p id="signupMessage"></p>
      <a href="login.html">Already have an account? Log in</a>
      <a href="index.html">Back to home</a>
    </div>

    <script src="script.js"></script>
  </body>
</html>
